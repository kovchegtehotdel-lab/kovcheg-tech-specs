<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Малый зал | Фотогалерея</title>
    <style>
        :root {
            --primary: #C5A059;
            --primary-hover: #B08D4A;
            --bg-body: #FAF9F6;
            --bg-dark: #2A2A2A;
            --text-main: #333333;
            --text-light: #F5F5F5;
            --card-bg: #FFFFFF;
            --border-color: #EAE8E3;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            cursor: none;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- КАСТОМНЫЙ КУРСОР --- */
        .cursor-dot {
            width: 8px; height: 8px; background-color: var(--primary); border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
        }
        .cursor-ring {
            width: 40px; height: 40px; border: 1px solid rgba(197, 160, 89, 0.5); border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, border-color 0.2s, background-color 0.2s;
        }
        .cursor-ring.hover {
            width: 70px; height: 70px; border-color: var(--primary);
            background-color: rgba(197, 160, 89, 0.1);
        }

        /* --- ШАПКА ГАЛЕРЕИ --- */
        .gallery-hero {
            background: var(--bg-body);
            color: var(--text-main);
            padding: 60px 20px 40px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid var(--border-color);
            z-index: 2;
        }

        .gallery-hero h1 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 15px;
        }

        .gallery-hero h2 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.1;
            text-transform: uppercase;
            color: var(--bg-dark);
            margin-bottom: 15px;
        }

        .gallery-subtitle {
            font-size: 1rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-top: 15px;
            color: var(--bg-dark);
            text-decoration: none;
            font-size: 0.9rem;
            border-bottom: 1px dotted var(--primary);
            transition: color 0.2s, border-color 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* --- СЕТКА МИНИАТЮР --- */
        .gallery-grid {
            max-width: 1300px;
            margin: 0 auto;
            padding: 50px 20px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
            position: relative;
            z-index: 3;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px; /* Чуть больше скругление для премиума */
            cursor: pointer;
            background: #eee;
            aspect-ratio: 4 / 3;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            /* Для плавного появления */
            opacity: 0;
            transform: translateY(30px);
            filter: blur(5px);
        }

        .gallery-item.revealed {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            transition: opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
        }

        /* Золотая рамка при наведении */
        .gallery-item::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid transparent;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(197,160,89,0) 0%, rgba(197,160,89,0.8) 50%, rgba(197,160,89,0) 100%) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 2;
        }

        .gallery-item:hover {
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .gallery-item:hover::after {
            opacity: 1;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        /* Параллакс-эффект внутри картинки */
        .gallery-item:hover img {
            transform: scale(1.05); /* Легкий базовый зум */
        }

        /* --- ЛАЙТБОКС (ПРЕМИАЛЬНЫЙ) --- */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 10, 0.98); /* Глубокий черный */
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(10px); /* Размытие фона */
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 0 80px rgba(0,0,0,0.9);
            /* Анимация въезда картинки */
            animation: zoomIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0.8; }
            to { transform: scale(1); opacity: 1; }
        }

        .lb-btn {
            position: absolute;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            user-select: none;
            z-index: 10;
        }

        .lb-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(1.1) translateY(-50%); /* Для боковых кнопок */
        }

        /* Исправляем трансформацию для боковых кнопок */
        .lb-prev:hover, .lb-next:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .lb-close {
            top: 20px;
            right: 20px;
            transform: none; /* Убираем трансформацию для крестика */
        }
        .lb-close:hover {
            transform: scale(1.1);
        }

        .lb-prev { left: 30px; top: 50%; transform: translateY(-50%); }
        .lb-next { right: 30px; top: 50%; transform: translateY(-50%); }

        .lb-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #d1d1d1;
            font-size: 1rem;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(197, 160, 89, 0.3); /* Золотая рамка */
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 768px) {
            body { cursor: auto; }
            .cursor-dot, .cursor-ring { display: none; }

            .gallery-hero h1 { font-size: 0.8rem; letter-spacing: 2px; }
            .gallery-hero h2 { font-size: 2.2rem; letter-spacing: 1px; }
            .gallery-subtitle { font-size: 0.85rem; letter-spacing: 2px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 30px 12px 60px; }
            .lb-btn { width: 42px; height: 42px; font-size: 1.2rem; }
            .lb-prev { left: 8px; }
            .lb-next { right: 8px; }
            .lb-close { top: 8px; right: 8px; }
            .lb-counter { bottom: 20px; font-size: 0.8rem; padding: 5px 12px; }
        }
    </style>
</head>
<body>

    <!-- Кастомный курсор -->
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <!-- ШАПКА -->
    <div class="gallery-hero">
        <h1>Культурный духовно-просветительский центр «Ковчег»</h1>
        <h2>Малый театральный зал</h2>
        <p class="gallery-subtitle">Техническая фотогалерея</p>
        <a href="index_mtz.html" class="back-link">← Вернуться к техническому паспорту зала</a>
        <br>
        <a href="index.html" class="back-link" style="margin-top: 10px;">← На главную (выбор зала)</a>
    </div>

    <!-- СЕТКА ФОТО -->
    <div class="gallery-grid" id="galleryGrid"></div>

    <!-- ЛАЙТБОКС -->
    <div class="lightbox" id="lightbox">
        <button class="lb-btn lb-close" id="lbClose" aria-label="Закрыть">×</button>
        <button class="lb-btn lb-prev" id="lbPrev" aria-label="Предыдущее">‹</button>
        <img id="lbImage" src="" alt="">
        <button class="lb-btn lb-next" id="lbNext" aria-label="Следующее">›</button>
        <div class="lb-counter" id="lbCounter"></div>
    </div>

    <script>
        // Список файлов в логической последовательности
        const photos = [
            "001_hall_mtz_001_1.jpg",
            "003_hall_mtz_003_3.jpg",
            "005_hall_mtz_006_6.jpg",
            "006_hall_mtz_007_7.jpg",
            "009_hall_mtz_012_12.jpg",
            "011_hall_mtz_018_18.jpg",
            "015_hall_mtz_024_24.jpg",
            "016_hall_mtz_025_25.jpg",
            "020_hall_mtz_029_29.jpg",
            "023_hall_mtz_032_32.jpg",
            "002_hall_mtz_002_2.jpg",
            "004_hall_mtz_005_5.jpg",
            "007_hall_mtz_010_10.jpg",
            "008_hall_mtz_011_11.jpg",
            "010_hall_mtz_017_17.jpg",
            "012_hall_mtz_020_20.jpg",
            "013_hall_mtz_021_21.jpg",
            "014_hall_mtz_022_22.jpg",
            "021_hall_mtz_030_30.jpg",
            "022_hall_mtz_031_31.jpg",
            "017_hall_mtz_026_26.jpg",
            "018_hall_mtz_027_27.jpg",
            "019_hall_mtz_028_28.jpg",
            "024_hall_mtz_034_2.jpg",
            "025_hall_mtz_036_4.jpg",
            "026_hall_mtz_038_6.jpg",
            "027_hall_mtz_039_7.jpg",
            "029_hall_mtz_043_11.jpg",
            "030_hall_mtz_044_12.jpg",
            "032_hall_mtz_049_17.jpg",
            "033_hall_mtz_050_18.jpg",
            "035_hall_mtz_056_24.jpg",
            "036_hall_mtz_059_27.jpg",
            "038_hall_mtz_065_33.jpg",
            "039_hall_mtz_067_35.jpg",
            "046_hall_mtz_085_53.jpg",
            "049_hall_mtz_092_60.jpg",
            "049a_hall_mtz_081_49.jpg",
            "028_hall_mtz_042_10.jpg",
            "031_hall_mtz_045_13.jpg",
            "034_hall_mtz_053_21.jpg",
            "037_hall_mtz_062_30.jpg",
            "040_hall_mtz_069_37.jpg",
            "041_hall_mtz_071_39.jpg",
            "042_hall_mtz_076_44.jpg",
            "043_hall_mtz_078_46.jpg",
            "044_hall_mtz_082_50.jpg",
            "045_hall_mtz_084_52.jpg",
            "047_hall_mtz_087_55.jpg",
            "048_hall_mtz_090_58.jpg",
            "050_hall_mtz_095_63.jpg",
            "051_hall_mtz_097_65.jpg",
            "052_hall_mtz_098_33.jpg",
            "053_hall_mtz_099_34.jpg",
            "054_hall_mtz_100_35.jpg",
            "055_hall_mtz_102_37.jpg",
            "056_hall_mtz_103_38.jpg",
            "057_hall_mtz_104_39.jpg",
            "058_hall_mtz_105_40.jpg",
            "059_hall_mtz_107_42.jpg"
        ];

        const basePath = "photos_mtz_web/";
        const grid = document.getElementById("galleryGrid");
        const lightbox = document.getElementById("lightbox");
        const lbImage = document.getElementById("lbImage");
        const lbCounter = document.getElementById("lbCounter");
        let currentIndex = 0;

        // 1. Кастомный курсор
        const cursorDot = document.getElementById('cursorDot');
        const cursorRing = document.getElementById('cursorRing');
        let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';
        });

        function animateRing() {
            ringX += (mouseX - ringX) * 0.15;
            ringY += (mouseY - ringY) * 0.15;
            cursorRing.style.left = ringX + 'px';
            cursorRing.style.top = ringY + 'px';
            requestAnimationFrame(animateRing);
        }
        animateRing();

        // 2. Построение сетки с анимацией появления
        photos.forEach((file, i) => {
            const item = document.createElement("div");
            item.className = "gallery-item";
            
            const img = document.createElement("img");
            img.src = basePath + file;
            img.alt = "Фото зала " + (i + 1);
            img.loading = "lazy";
            item.appendChild(img);
            
            // Навешиваем события наведения для курсора
            item.addEventListener('mouseenter', () => cursorRing.classList.add('hover'));
            item.addEventListener('mouseleave', () => cursorRing.classList.remove('hover'));
            
            // Клик по фото
            item.addEventListener("click", () => openLightbox(i));
            
            // Параллакс-эффект при движении мыши внутри карточки
            item.addEventListener('mousemove', (e) => {
                const rect = item.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                // Смещение картинки на 10% от расстояния до центра
                const moveX = (x - centerX) / centerX * 10;
                const moveY = (y - centerY) / centerY * 10;
                
                img.style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
            });
            
            // Возврат в исходное положение
            item.addEventListener('mouseleave', () => {
                img.style.transform = 'scale(1) translate(0, 0)';
            });
            
            grid.appendChild(item);
        });

        // 3. Анимация появления при скролле
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    // Добавляем задержку для каскадного эффекта
                    setTimeout(() => {
                        entry.target.classList.add('revealed');
                    }, index * 50); // 50мс задержка между фото
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.gallery-item').forEach(item => {
            observer.observe(item);
        });

        // 4. Лайтбокс
        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lightbox.classList.remove("active");
            document.body.style.overflow = "";
        }

        function updateLightbox() {
            lbImage.src = basePath + photos[currentIndex];
            lbCounter.textContent = (currentIndex + 1) + " / " + photos.length;
        }

        function nextPhoto() {
            currentIndex = (currentIndex + 1) % photos.length;
            updateLightbox();
        }

        function prevPhoto() {
            currentIndex = (currentIndex - 1 + photos.length) % photos.length;
            updateLightbox();
        }

        document.getElementById("lbClose").addEventListener("click", closeLightbox);
        document.getElementById("lbNext").addEventListener("click", nextPhoto);
        document.getElementById("lbPrev").addEventListener("click", prevPhoto);

        // Клик вне изображения закрывает лайтбокс
        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // Клавиатура
        document.addEventListener("keydown", (e) => {
            if (!lightbox.classList.contains("active")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowRight") nextPhoto();
            if (e.key === "ArrowLeft") prevPhoto();
        });
    </script>
</body>
</html>
