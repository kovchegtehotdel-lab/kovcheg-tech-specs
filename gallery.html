<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотогалерея | Большой концертный зал</title>
    <style>
        :root {
            --primary: #C5A059;
            --primary-hover: #B08D4A;
            --bg-body: #FAF9F6;
            --bg-dark: #2A2A2A;
            --text-main: #333333;
            --text-light: #F5F5F5;
            --card-bg: #FFFFFF;
            --border-color: #EAE8E3;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* --- ШАПКА ГАЛЕРЕИ --- */
        .gallery-hero {
            background: var(--bg-body); /* Тёплый кремовый фон, как у всей страницы */
            color: var(--text-main);
            padding: 60px 20px 40px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }

        .gallery-hero h1 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #777; /* Спокойный серый вместо белого */
            margin-bottom: 15px;
        }

        .gallery-hero h2 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.1;
            text-transform: uppercase;
            color: var(--bg-dark); /* Тёмно-серый, как на главной */
            margin-bottom: 15px;
        }

        .gallery-subtitle {
            font-size: 1rem;
            color: var(--primary); /* Золотой акцент */
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-top: 15px;
            color: var(--bg-dark);
            text-decoration: none;
            font-size: 0.9rem;
            border-bottom: 1px dotted var(--primary);
            transition: color 0.2s, border-color 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* --- СЕТКА МИНИАТЮР --- */
        .gallery-grid {
            max-width: 1300px;
            margin: 0 auto;
            padding: 50px 20px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            cursor: pointer;
            background: #eee;
            aspect-ratio: 4 / 3;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }

        .gallery-item:hover img { transform: scale(1.06); }

        /* --- ЛАЙТБОКС --- */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.94);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .lightbox.active { display: flex; }

        .lightbox img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
        }

        .lb-btn {
            position: absolute;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
            user-select: none;
        }

        .lb-btn:hover { background: var(--primary); border-color: var(--primary); transform: scale(1.05); }

        .lb-close { top: 20px; right: 20px; }
        .lb-prev  { left: 20px; top: 50%; transform: translateY(-50%); }
        .lb-next  { right: 20px; top: 50%; transform: translateY(-50%); }

        .lb-prev:hover, .lb-next:hover { transform: translateY(-50%) scale(1.05); }

        .lb-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #d1d1d1;
            font-size: 0.9rem;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 20px;
        }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 768px) {
            .gallery-hero h1 { font-size: 0.8rem; letter-spacing: 2px; }
            .gallery-hero h2 { font-size: 2.2rem; letter-spacing: 1px; }
            .gallery-subtitle { font-size: 0.85rem; letter-spacing: 2px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 30px 12px 60px; }
            .lb-btn { width: 42px; height: 42px; font-size: 1.2rem; }
            .lb-prev { left: 8px; }
            .lb-next { right: 8px; }
            .lb-close { top: 8px; right: 8px; }
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <div class="gallery-hero">
        <h1>Культурный духовно-просветительский центр «Ковчег»</h1>
        <h2>Большой концертный зал</h2>
        <p class="gallery-subtitle">Техническая фотогалерея</p>
        <a href="index.html" class="back-link">← Вернуться к техническому паспорту зала</a>
    </div>

    <!-- СЕТКА ФОТО -->
    <div class="gallery-grid" id="galleryGrid"></div>

    <!-- ЛАЙТБОКС -->
    <div class="lightbox" id="lightbox">
        <button class="lb-btn lb-close" id="lbClose" aria-label="Закрыть">×</button>
        <button class="lb-btn lb-prev" id="lbPrev" aria-label="Предыдущее">‹</button>
        <img id="lbImage" src="" alt="">
        <button class="lb-btn lb-next" id="lbNext" aria-label="Следующее">›</button>
        <div class="lb-counter" id="lbCounter"></div>
    </div>

    <script>
        // Список файлов (порядок = порядок отображения)
const photos = [
    // --- ОТКРЫТИЕ: ПАНОРАМА И ОБЩИЕ ВИДЫ ---
    "hall_pano_9774.jpg",      // панорама зала
    "hall_108_007.jpg",        // общий вид: люстра, сцена, партер
    "hall_110_009.jpg",        // общий вид сбоку: люстра, балкон
    "hall_113_012.jpg",        // общий вид: партер, ложи
    "hall_078_032.jpg",        // сцена с подвесами

    // --- УПРАВЛЕНИЕ И ПУЛЬТЫ ---
    "hall_089_043.jpg",        // пультовая: свет и звук, вид на сцену
    "hall_088_042.jpg",        // пультовая: Yamaha, рабочий момент
    "hall_064_018.jpg",        // пульт светового управления

    // --- ЗВУК ---
    "hall_283_114.jpg",        // линейные массивы L-Acoustics
    "hall_047_001.jpg",        // микрофоны Shure в кейсе
    "hall_079_033.jpg",        // подвешенный микрофон (вертикаль)
    "hall_083_037.jpg",        // сценические мониторы
    "hall_085_039.jpg",        // монитор, провод, пол
    "hall_050_004.jpg",        // кейсы с микрофонами, кабели

    // --- КОММУТАЦИЯ И ИНЖЕНЕРИЯ ---
    "hall_063_017.jpg",        // серверная стойка, цветные провода
    "hall_080_034.jpg",        // люк в полу с разъемами
    "hall_081_035.jpg",        // люк с крышкой в интерьере
    "hall_124_023.jpg",        // люк в деревянной стене

    // --- СВЕТ: ОБОРУДОВАНИЕ И ДЕТАЛИ ---
    "hall_165_065.jpg",        // приборы на ферме (крупный план)
    "hall_210_040.jpg",        // ферма, жёлтые лучи
    "hall_211_041.jpg",        // ферма, фиолетовый и жёлтый
    "hall_212_042.jpg",        // LED-приборы на ферме
    "hall_216_046.jpg",        // ферма с приборами, вид снизу
    "hall_276_106.jpg",        // ферма с приборами (симметрия)
    "hall_279_109.jpg",        // ферма в синем/фиолетовом
    "hall_233_063.jpg",        // прибор с оранжевыми линзами

    // --- СВЕТ В ДЕЙСТВИИ ---
    "hall_175_005.jpg",        // сцена, узор на полу
    "hall_192_022.jpg",        // сцена, лучи, вид из партера
    "hall_193_023.jpg",        // сцена, синий свет
    "hall_195_025.jpg",        // сцена крупно, желтые блики
    "hall_201_031.jpg",        // сцена, три оранжевых прибора
    "hall_208_038.jpg",        // сцена, красные и желтые тона
    "hall_218_048.jpg",        // сцена в дыму, цветные лучи

    // --- ВИДЕО И LED-ЭКРАН ---
    "hall_243_073.jpg",        // LED-экран: космос и книга
    "hall_255_085.jpg",        // LED-экран: ночной лес и луна

    // --- ЛЮСТРА ---
    "hall_138_000.jpg",        // люстра сверху (круг)
    "hall_142_140.jpg",        // люстра снизу (перспектива)
    "hall_205_035.jpg",        // люстра с золотой птицей
    "hall_213_043.jpg",        // люстра с птицей, вид снизу
    "hall_200_030.jpg",        // люстра в красно-фиолетовом
    "hall_186_016.jpg",        // люстра в зелёной подсветке

    // --- ЗАКРЫТИЕ: ИНТЕРЬЕР И ДЕТАЛИ ---
    "hall_188_018.jpg",        // балкон в цветной подсветке
    "hall_046_003.jpg",        // текстура покрытия сцены
    "hall_284_9261.jpg"        // двери с подсветкой (финальный акцент)
];

        const basePath = "photos_web/";
        const grid = document.getElementById("galleryGrid");
        const lightbox = document.getElementById("lightbox");
        const lbImage = document.getElementById("lbImage");
        const lbCounter = document.getElementById("lbCounter");
        let currentIndex = 0;

        // Построение сетки
        photos.forEach((file, i) => {
            const item = document.createElement("div");
            item.className = "gallery-item";
            const img = document.createElement("img");
            img.src = basePath + file;
            img.alt = "Фото зала " + (i + 1);
            img.loading = "lazy";
            item.appendChild(img);
            item.addEventListener("click", () => openLightbox(i));
            grid.appendChild(item);
        });

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lightbox.classList.remove("active");
            document.body.style.overflow = "";
        }

        function updateLightbox() {
            lbImage.src = basePath + photos[currentIndex];
            lbCounter.textContent = (currentIndex + 1) + " / " + photos.length;
        }

        function nextPhoto() {
            currentIndex = (currentIndex + 1) % photos.length;
            updateLightbox();
        }

        function prevPhoto() {
            currentIndex = (currentIndex - 1 + photos.length) % photos.length;
            updateLightbox();
        }

        document.getElementById("lbClose").addEventListener("click", closeLightbox);
        document.getElementById("lbNext").addEventListener("click", nextPhoto);
        document.getElementById("lbPrev").addEventListener("click", prevPhoto);

        // Клик вне изображения закрывает лайтбокс
        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // Клавиатура
        document.addEventListener("keydown", (e) => {
            if (!lightbox.classList.contains("active")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowRight") nextPhoto();
            if (e.key === "ArrowLeft") prevPhoto();
        });
    </script>
</body>
</html>
